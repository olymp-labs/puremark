services:
  puremark:
    image: ghcr.io/olymp-labs/puremark:prod
    container_name: puremark
    restart: unless-stopped
    cap_drop:
      - ALL
    cpus: "0.2"
    mem_limit: "200M"
    volumes:
      - "data:/app/db/"
    # See .env file for env variable descriptions
    #environment:
    #  - DB_PREFILL=false
    #  - DB_ALLOW_EXPORT=true
    #  - DB_ALLOW_IMPORT=true

volumes:
  data:
